<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso|Misterios</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Trebuchet MS', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
    url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600&auto=format&fit=crop')
    center/cover;
    color:white;
}

.container{
    width:400px;
    background:rgba(20,20,20,0.9);
    padding:40px;
    border-radius:20px;
    border:1px solid #333;
    box-shadow:0 0 20px rgba(220,20,60,0.3);
    text-align:center;
    backdrop-filter:blur(8px);
}

h1{
    font-size:2.5rem;
    letter-spacing:4px;
    text-shadow:0 0 15px crimson;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px crimson;
    }
    to{
        text-shadow:0 0 25px red;
    }
}

p{
    color:#aaa;
    margin:15px 0 25px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:none;
    outline:none;
    border-radius:30px;
    background:#111;
    color:white;
    border:1px solid #333;
    transition:0.3s;
}

input:focus{
    border-color:crimson;
    box-shadow:0 0 15px crimson;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:crimson;
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

button:hover{
    background:black;
    border:1px solid crimson;
    transform:scale(1.03);
}

.link{
    margin-top:20px;
}

.link a{
    color:crimson;
    text-decoration:none;
}

.link a:hover{
    text-decoration:underline;
}

.mensaje{
    margin-top:15px;
    color:crimson;
}

.oculto{
    display:none;
}
</style>
</head>

<body>

<div class="container">

    <h1>Enigmas</h1>

    <p id="titulo">
        Inicia sesión para descubrir los secretos.
    </p>

    <form id="formulario">

        <input type="text" id="usuario" placeholder="Usuario" required>

        <input type="password" id="password" placeholder="Contraseña" required>

        <button type="submit" id="botonPrincipal">
            Iniciar sesión
        </button>

    </form>

    <div class="link">
        <a href="#" onclick="cambiarModo()">
            <span id="textoCambio">
                ¿No tienes cuenta? Crear una
            </span>
        </a>
    </div>

    <div class="mensaje" id="mensaje"></div>

</div>

<script>
let modoRegistro = false;

function cambiarModo(){
    modoRegistro = !modoRegistro;

    const titulo = document.getElementById("titulo");
    const boton = document.getElementById("botonPrincipal");
    const textoCambio = document.getElementById("textoCambio");
    const mensaje = document.getElementById("mensaje");

    mensaje.textContent = "";

    if(modoRegistro){
        titulo.textContent = "Crea una cuenta para entrar al misterio.";
        boton.textContent = "Crear cuenta";
        textoCambio.textContent = "¿Ya tienes cuenta? Iniciar sesión";
    }else{
        titulo.textContent = "Inicia sesión para descubrir los secretos.";
        boton.textContent = "Iniciar sesión";
        textoCambio.textContent = "¿No tienes cuenta? Crear una";
    }
}

document.getElementById("formulario").addEventListener("submit", function(e){

    e.preventDefault();

    const usuario = document.getElementById("usuario").value.trim();
    const password = document.getElementById("password").value.trim();

    const mensaje = document.getElementById("mensaje");

    let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    if(modoRegistro){

        const existe = usuarios.find(u => u.usuario === usuario);

        if(existe){
            mensaje.textContent = "Ese usuario ya existe.";
            return;
        }

        usuarios.push({
            usuario: usuario,
            password: password
        });

        localStorage.setItem("usuarios", JSON.stringify(usuarios));

        mensaje.textContent = "Cuenta creada correctamente.";

        document.getElementById("formulario").reset();

        cambiarModo();

    }else{

        const usuarioValido = usuarios.find(
            u => u.usuario === usuario && u.password === password
        );

        if(usuarioValido){

            localStorage.setItem("usuarioActivo", usuario);

            alert("Bienvenido, " + usuario + ". Los secretos te esperan...");

            window.location.href = "index.html";

        }else{
            mensaje.textContent = "Usuario o contraseña incorrectos.";
        }
    }
});
</script>

</body>
</html>
